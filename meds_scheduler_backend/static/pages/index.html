<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Farmacia - Iniciar sesión</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { 400: '#34d399', 500: '#22c55e', 600: '#16a34a' },
          },
        },
      },
      darkMode: 'class',
    };
  </script>
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/animations.css" />
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 antialiased">
  <div class="min-h-screen flex flex-col">
    <header class="border-b border-slate-800 bg-slate-950/80 backdrop-blur">
      <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="h-9 w-9 rounded-xl bg-emerald-500/10 border border-emerald-500/40 flex items-center justify-center">
            <span class="text-emerald-400 font-semibold text-lg">Rx</span>
          </div>
          <div>
            <h1 class="text-lg sm:text-xl font-semibold text-slate-50">Panel de Farmacia</h1>
            <p class="text-xs sm:text-sm text-slate-400">Iniciar sesión</p>
          </div>
        </div>
        <span id="supabase-status" class="px-3 py-1 rounded-full text-xs font-medium bg-slate-500/10 text-slate-400 border border-slate-500/30">
          Comprobando…
        </span>
      </div>
    </header>

    <main class="flex-1 flex items-center justify-center px-4 py-12">
      <div class="w-full max-w-md animate-fade-in-up">
        <div class="rounded-2xl border border-slate-800 bg-slate-950/60 backdrop-blur-sm p-6 space-y-5 card-hover">
          <h2 class="text-xl font-semibold text-slate-50">Iniciar sesión</h2>
          <form id="login-form" class="space-y-4">
            <div class="space-y-1">
              <label class="block text-xs font-medium text-slate-300">Correo electrónico</label>
              <input type="email" name="email" required autocomplete="email"
                class="w-full rounded-lg border border-slate-700 bg-slate-900 px-3 py-2 text-sm text-slate-100 placeholder-slate-500 focus:border-emerald-500 focus:outline-none"
                placeholder="tu@email.com" />
            </div>
            <div class="space-y-1">
              <label class="block text-xs font-medium text-slate-300">Contraseña</label>
              <input type="password" name="password" required autocomplete="current-password"
                class="w-full rounded-lg border border-slate-700 bg-slate-900 px-3 py-2 text-sm text-slate-100 placeholder-slate-500 focus:border-emerald-500 focus:outline-none"
                placeholder="••••••••" />
            </div>
            <p id="login-message" class="text-xs text-slate-400"></p>
            <button type="submit" class="w-full btn-primary">
              Entrar
            </button>
          </form>
          <p class="text-center text-sm text-slate-400">
            ¿No tienes cuenta? <a href="/register.html" class="text-emerald-400 hover:underline">Regístrate</a>
          </p>
        </div>
      </div>
    </main>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    document.body.classList.add('loaded');
    if (isLoggedIn()) {
      window.location.href = '/dashboard.html';
    }
    refreshSupabaseStatus();
    setInterval(refreshSupabaseStatus, 30000);

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const msg = document.getElementById('login-message');
      const email = form.email.value.trim();
      const password = form.password.value;
      msg.textContent = '';
      msg.className = 'text-xs text-slate-400';
      try {
        await login(email, password);
        window.location.href = '/dashboard.html';
      } catch (err) {
        msg.textContent = err.message || 'Error al iniciar sesión';
        msg.className = 'text-xs text-red-400';
      }
    });
  </script>
</body>
</html>
